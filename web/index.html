<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有生活的朋友 · 网页端</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    /* --- 晨雾（默认浅色皮肤） --- */
    --bg: #e8eee6; --surface: #f7faf5; --surface-2: #edf4eb; --line: #dbe7d8;
    --ink: #354139; --muted: #829184; --accent: #729a6d; --accent-soft: #dcead9;
    --bubble: #edf4eb; --friend-bubble: #ffffff; --shadow: 0 24px 70px rgba(75,104,79,.12);
    --me: #729a6d; --me-ink: #fff;
  }
  .skin-peach {
    --bg: #fff0e9; --surface: #fffaf7; --surface-2: #fff0e8; --line: #f1ddd3;
    --ink: #57443d; --muted: #a88f85; --accent: #d68d70; --accent-soft: #f7dfd3;
    --bubble: #fff0e8; --friend-bubble: #ffffff; --shadow: 0 24px 70px rgba(146,97,77,.12);
    --me: #d68d70; --me-ink: #fff;
  }
  .skin-night {
    --bg: #1d232c; --surface: #27303a; --surface-2: #303b45; --line: #3b4854;
    --ink: #eef2ed; --muted: #9ca9a8; --accent: #9ebda2; --accent-soft: #3b5148;
    --bubble: #334049; --friend-bubble: #2b343d; --shadow: 0 24px 70px rgba(0,0,0,.32);
    --me: #9ebda2; --me-ink: #15201a;
  }
  body { background: var(--bg); color: var(--ink); transition: background .35s, color .35s; min-height: 100vh; }
  button, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg { display: block; }

  /* ===== 三栏骨架 ===== */
  .app-shell { display: flex; min-height: 100vh; background: var(--bg); color: var(--ink); transition: background .35s, color .35s; }

  /* --- 左侧栏 --- */
  .sidebar { width: 264px; flex: 0 0 auto; display: flex; flex-direction: column; padding: 26px 16px 18px;
    border-right: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 72%, transparent); }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .brand-row strong { display: block; font-size: 14px; letter-spacing: .03em; }
  .brand-row span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
  .brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 11px;
    color: #fff; background: var(--accent); box-shadow: 0 6px 13px color-mix(in srgb, var(--accent) 30%, transparent); }
  .friend-card { margin: 30px 0 6px; padding: 14px; background: var(--surface-2); border-radius: 16px; }
  .friend-card .fc-top { display: flex; align-items: center; gap: 11px; }
  .friend-avatar { display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 auto;
    color: var(--accent); background: var(--accent-soft); border-radius: 14px; }
  .friend-card h2 { margin: 0; font-size: 15px; letter-spacing: .01em; }
  .friend-card .fc-sub { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
  .live-pill { display: inline-flex; align-items: center; gap: 5px; margin-left: 7px; padding: 3px 8px;
    color: var(--accent); background: var(--accent-soft); border-radius: 99px; font-size: 10px; }
  .live-pill i { width: 5px; height: 5px; border-radius: 50%; background: currentColor;
    box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 13%, transparent); }
  .fc-row { display: flex; justify-content: space-between; margin-top: 11px; font-size: 11px; color: var(--muted); }
  .fc-row b { color: var(--ink); font-weight: 600; }
  .side-label { padding: 18px 11px 9px; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
  .flist { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
  .fitem { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 0; border-radius: 11px;
    background: transparent; text-align: left; font-size: 12px; color: var(--muted); }
  .fitem:hover { color: var(--ink); background: var(--surface-2); }
  .fitem.active { color: var(--ink); background: var(--surface-2); }
  .fitem .fname { flex: 1; cursor: pointer; }
  .fitem .fat { font-size: 10px; color: var(--muted); }
  .fitem .fop { font-size: 10.5px; color: var(--muted); cursor: pointer; padding: 0 2px; }
  .fitem .fop:hover { color: var(--accent); }
  .fitem .fop.del:hover { color: #e07a7a; }
  .fitem.cur { outline: 1px solid var(--accent); }
  .empty { font-size: 11.5px; color: var(--muted); padding: 8px 11px; line-height: 1.6; }
  .sidebar-bottom { display: flex; flex-direction: column; gap: 3px; margin-top: auto; }
  .sidebar-link { display: flex; align-items: center; gap: 9px; padding: 9px 11px; color: var(--muted);
    background: transparent; border: 0; text-align: left; font-size: 12px; border-radius: 10px; }
  .sidebar-link:hover { color: var(--accent); background: var(--surface-2); }

  /* --- 中间工作区 --- */
  .workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; height: 75px; padding: 0 30px;
    border-bottom: 1px solid var(--line); }
  .mobile-brand { display: none; align-items: center; gap: 9px; }
  .breadcrumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .crumb-current { color: var(--ink); font-weight: 600; }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn { display: grid; place-items: center; width: 34px; height: 34px; color: var(--muted);
    background: transparent; border: 0; border-radius: 10px; }
  .icon-btn:hover { color: var(--accent); background: var(--surface-2); }
  .avatar-btn { width: 36px; height: 36px; border: 0; border-radius: 50%; color: #fff; background: var(--accent);
    font-size: 12px; box-shadow: 0 4px 10px color-mix(in srgb, var(--accent) 28%, transparent); }

  /* 账户菜单 */
  .menu-wrap { position: relative; }
  .account-menu { position: absolute; right: 0; top: 46px; z-index: 30; width: 218px; padding: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .account-menu .menu-sec { padding: 6px 8px 8px; color: var(--muted); font-size: 10px; letter-spacing: .05em; }
  .skin-row { display: flex; gap: 6px; padding: 0 8px 6px; }
  .skin-opt { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 4px;
    background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; font-size: 10px; color: var(--muted); }
  .skin-opt i { width: 18px; height: 18px; border-radius: 50%; }
  .skin-opt.selected { border-color: var(--accent); color: var(--ink); }
  .menu-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px 9px; color: var(--ink);
    background: transparent; border: 0; border-radius: 9px; font-size: 12.5px; text-align: left; }
  .menu-item:hover { background: var(--surface-2); }
  .menu-item.on { color: var(--accent); }
  .menu-item svg { color: var(--muted); }
  .menu-item.on svg, .menu-item:hover svg { color: var(--accent); }
  .menu-div { height: 1px; background: var(--line); margin: 5px 6px; }
  .menu-item.danger { color: #d98a8a; }
  .menu-item.danger svg { color: #d98a8a; }

  .content-grid { display: grid; grid-template-columns: minmax(0,1fr) 326px; gap: 22px; max-width: 1240px;
    width: 100%; margin: 0 auto; padding: 24px 30px; flex: 1; }
  .chat-panel { display: flex; flex-direction: column; min-height: 0; padding: 20px 24px 16px;
    background: var(--surface); border: 1px solid color-mix(in srgb, var(--line) 65%, transparent);
    border-radius: 22px; box-shadow: var(--shadow); min-width: 0; }
  .chat-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px;
    border-bottom: 1px solid var(--line); }
  .friend-heading { display: flex; align-items: center; gap: 11px; }
  .friend-heading h1 { margin: 0; font-size: 16px; letter-spacing: .01em; }
  .friend-heading p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }

  /* 状态卡（HUD 浓缩在聊天头顶） */
  .status-card { display: flex; align-items: center; gap: 12px; margin: 16px 0 6px; padding: 11px 14px;
    background: var(--surface-2); border-radius: 14px; }
  .status-icon { display: grid; place-items: center; width: 28px; height: 28px; color: var(--accent);
    background: var(--surface); border-radius: 10px; }
  .status-card strong { display: block; font-size: 12px; font-weight: 600; }
  .status-card span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
  .energy-bar { width: 76px; height: 5px; margin-left: auto; overflow: hidden; background: var(--line); border-radius: 99px; }
  .energy-bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .35s; }

  .message-area { flex: 1; overflow-y: auto; padding: 10px 6px; display: flex; flex-direction: column; min-height: 0; }
  .daydiv { align-self: center; background: var(--surface-2); color: var(--muted); font-size: 11px;
    padding: 4px 12px; border-radius: 12px; margin: 12px 0 4px; }
  .msg { display: flex; flex-direction: column; max-width: 80%; margin: 4px 0; }
  .msg.ai { align-self: flex-start; align-items: flex-start; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.sys { align-self: flex-start; background: transparent; color: var(--muted); font-size: 11px;
    text-align: left; white-space: pre-wrap; line-height: 1.6; font-family: ui-monospace, Consolas, monospace; max-width: 92%; }
  .bubble { padding: 10px 14px; border-radius: 8px 16px 16px 16px; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; }
  .msg.ai .bubble { background: var(--friend-bubble); color: var(--ink); border: 1px solid var(--line); }
  .msg.user .bubble { background: var(--me); color: var(--me-ink); border-radius: 16px 8px 16px 16px; }
  .mtime { font-size: 10px; color: var(--muted); margin-top: 3px; padding: 0 4px; }
  .typing { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; margin: 6px 2px; }
  .typing-bubble { display: flex; gap: 3px; padding: 9px 11px; background: var(--friend-bubble);
    border: 1px solid var(--line); border-radius: 6px 13px 13px 13px; }
  .typing-bubble i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); animation: bounce 1s infinite; }
  .typing-bubble i:nth-child(2) { animation-delay: .15s; }
  .typing-bubble i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-3px); } }

  .composer-wrap { padding-top: 12px; border-top: 1px solid var(--line); }
  .quick-replies { display: flex; gap: 7px; margin: 0 0 10px; flex-wrap: wrap; }
  .quick-replies button { padding: 6px 11px; color: var(--muted); background: var(--surface-2);
    border: 0; border-radius: 9px; font-size: 11px; }
  .quick-replies button:hover { color: var(--accent); }
  .composer { display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 14px;
    background: var(--surface-2); border: 1px solid transparent; border-radius: 14px; }
  .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .composer textarea { flex: 1; min-height: 22px; max-height: 120px; padding: 5px 0; color: var(--ink);
    background: transparent; border: 0; outline: 0; resize: none; font-size: 13px; }
  .composer textarea::placeholder { color: var(--muted); }
  .send-btn { display: grid; place-items: center; width: 32px; height: 32px; color: #fff; background: var(--accent);
    border: 0; border-radius: 10px; flex: 0 0 auto; }
  .composer-foot { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px 0;
    color: var(--muted); font-size: 10px; }
  .urgent-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .urgent-toggle input { accent-color: var(--accent); width: 13px; height: 13px; }

  /* --- 右侧洞察栏 --- */
  .insight-panel { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .insight-title { display: flex; align-items: center; justify-content: space-between; margin: 2px 2px 0;
    font-size: 13px; font-weight: 600; }
  .hud-card { padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
  .hud-status { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
  .hud-status .phase { font-weight: 700; }
  .phase.working { color: #e0a93b; } .phase.flow { color: #e07ab8; } .phase.free { color: #5bc08a; }
  .phase.off { color: #5bc08a; } .phase.idle { color: #8a8fc0; } .phase.break { color: #a78bf0; }
  .phase.sleep { color: #8a8fc0; }
  .badge { display: inline-block; font-size: 10px; border-radius: 6px; padding: 1px 6px; vertical-align: middle; }
  .cost.welcomed { color: #5bc08a; border: 1px solid #5bc08a; }
  .cost.tolerated { color: #e0a93b; border: 1px solid #e0a93b; }
  .cost.costly { color: #e87a7a; border: 1px solid #e87a7a; }
  .cost.sleep { color: #8a8fc0; border: 1px solid #8a8fc0; }
  .mood.positive { color: #5bc08a; border: 1px solid #5bc08a; }
  .mood.neutral { color: #8a8fc0; border: 1px solid #8a8fc0; }
  .mood.tired { color: #e0a93b; border: 1px solid #e0a93b; }
  .mood.sleep { color: #8a8fc0; border: 1px solid #8a8fc0; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .stat { background: var(--surface-2); border-radius: 12px; padding: 10px 11px; }
  .stat .s-label { font-size: 10px; color: var(--muted); }
  .stat .s-val { font-size: 16px; font-weight: 700; margin-top: 3px; }
  .stat .s-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .mini-bar { height: 5px; margin-top: 7px; overflow: hidden; background: var(--line); border-radius: 99px; }
  .mini-bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .4s; }
  .mini-bar.e > i { background: #5bc08a; } .mini-bar.p > i { background: #6bb8ff; }
  .quote-card { padding: 15px; color: var(--accent); background: var(--accent-soft); border-radius: 16px; }
  .quote-card p { margin: 9px 0 8px; color: var(--ink); font-size: 12px; line-height: 1.75; }
  .quote-card small { color: var(--muted); font-size: 10px; }

  /* 调试 / 意识流（默认收起，账户菜单里开） */
  .ext-card { padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; display: none; }
  .ext-card.open { display: block; }
  .ext-card h3 { font-size: 13px; margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }
  .ext-card h3 .ec-sub { margin-left: auto; font-size: 10px; color: var(--muted); font-weight: 400; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); border-radius: 10px;
    padding: 8px 9px; font-size: 11.5px; text-align: center; }
  .btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.warn { color: #d98a8a; }
  .btn.warn:hover { background: color-mix(in srgb, #e07a7a 14%, transparent); border-color: #e07a7a; }
  .btnrow { display: flex; gap: 8px; margin-top: 10px; }
  .btnrow .btn { flex: 1; }
  .panel { background: var(--surface-2); border-radius: 12px; padding: 11px; margin-top: 12px; max-height: 280px; overflow: auto; }
  .panel pre { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--ink); white-space: pre-wrap; line-height: 1.65; }
  .panel .ph { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); margin-bottom: 7px; }
  .panel .ph .clr { cursor: pointer; }
  .busy { color: #e0a93b; }
  .stream-list { display: flex; flex-direction: column; gap: 9px; max-height: 320px; overflow: auto; }
  .stream-item { display: flex; gap: 10px; font-size: 11.5px; }
  .stream-item .sk { flex: 0 0 auto; width: 16px; height: 16px; border-radius: 5px; margin-top: 2px;
    display: grid; place-items: center; font-size: 9px; color: #fff; }
  .sk.inbox { background: #6bb8ff; } .sk.reply { background: var(--accent); }
  .sk.monologue { background: #a78bf0; } .sk.work { background: #e0a93b; }
  .sk.sleep { background: #8a8fc0; } .sk.wake { background: #5bc08a; }
  .stream-item .st-body { flex: 1; }
  .stream-item .st-text { color: var(--ink); line-height: 1.6; }
  .stream-item .st-time { color: var(--muted); font-size: 10px; margin-top: 2px; }

  .mobile-menu { display: none; position: fixed; right: 16px; bottom: 18px; z-index: 25; width: 44px; height: 44px;
    color: #fff; background: var(--accent); border: 0; border-radius: 14px; box-shadow: var(--shadow); }

  @media (max-width: 980px) {
    .sidebar { width: 220px; }
    .content-grid { grid-template-columns: minmax(0,1fr) 280px; padding: 18px; gap: 16px; }
    .topbar { padding: 0 18px; }
  }
  @media (max-width: 760px) {
    .sidebar { display: none; }
    .topbar { height: 64px; }
    .mobile-brand { display: flex; }
    .breadcrumbs { display: none; }
    .mobile-menu { display: grid; place-items: center; }
    .content-grid { display: block; padding: 14px; }
    .chat-panel { min-height: calc(100vh - 92px); border-radius: 18px; }
    .insight-panel { margin-top: 16px; }
    .friend-heading p { display: none; }
  }
</style>
</head>
<body>
  <div class="app-shell" id="app">
    <!-- 左侧栏 -->
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand-mark"><svg width="17" height="17" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9C1 8.9 2.4 5.5 5.5 5.5c1.9 0 3.2 1 4.5 2.6C11.3 6.5 12.6 5.5 14.5 5.5c3.1 0 4.5 3.4 3.1 6.5C19.5 16.4 12 21 12 21z"/></svg></div>
        <div><strong>有生活的朋友</strong><span>你的日常陪伴空间</span></div>
      </div>

      <div class="friend-card">
        <div class="fc-top">
          <div class="friend-avatar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg></div>
          <div style="flex:1;min-width:0">
            <h2>小满<span class="live-pill" id="pLinkPill"><i></i><span id="pLink">—</span></span></h2>
            <p class="fc-sub" id="pDesc"></p>
          </div>
        </div>
        <div class="fc-row"><span>作息</span><b id="pSch">—</b></div>
        <div class="fc-row"><span>关系</span><b id="pStage">—</b></div>
      </div>

      <div class="side-label">归档的朋友</div>
      <div class="flist" id="flist"></div>

      <div class="sidebar-bottom">
        <button class="sidebar-link" data-cmd="/diary"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>今天的日记</button>
        <button class="sidebar-link" data-cmd="/memories"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/><path d="M12 8v4l3 2"/></svg>TA 记住的事</button>
        <button class="sidebar-link" id="btnSwitch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 3h5v5"/><path d="M8 21H3v-5"/><path d="M21 3 14 10M3 21l7-7"/></svg>换朋友</button>
        <button class="sidebar-link" id="btnNew"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>抽个新朋友</button>
      </div>
    </aside>

    <!-- 中间工作区 -->
    <section class="workspace">
      <header class="topbar">
        <div class="mobile-brand"><div class="brand-mark"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9C1 8.9 2.4 5.5 5.5 5.5c1.9 0 3.2 1 4.5 2.6C11.3 6.5 12.6 5.5 14.5 5.5c3.1 0 4.5 3.4 3.1 6.5C19.5 16.4 12 21 12 21z"/></svg></div><strong>有生活的朋友</strong></div>
        <div class="breadcrumbs"><span>我的朋友</span><span style="color:var(--muted)">›</span><span class="crumb-current" id="crumbName">…</span><span class="live-pill"><i></i><span id="crumbPill">在线</span></span></div>
        <div class="top-actions">
          <div class="menu-wrap">

<script>
// 会话过期统一跳登录页（与服务器开了登录验证时）
(function(){
  const raw = window.fetch.bind(window);
  window.fetch = async function(){
    const r = await raw.apply(null, arguments);
    if (r.status === 401) {
      const u = new URL(r.url, location.href);
      if (u.pathname !== '/login') location.href = '/login';
    }
    return r;
  };
})();

let lastId = 0;
const shownIds = new Set();
const $ = id => document.getElementById(id);
const chat = () => $('chat');
const QUOTES = [
  '不必成为更好的人，今天也可以只是成为自己。',
  '慢慢来，我们不需要一次解决全部。',
  '你愿意说，我就愿意听。',
  '今天的云有点慢，正好适合发会儿呆。',
  '记得喝水，也记得对自己温柔一点。',
];

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ===== 皮肤 ===== */
function applySkin(skin){
  const app = $('app');
  app.classList.remove('skin-mist','skin-peach','skin-night');
  app.classList.add('skin-' + skin);
  document.querySelectorAll('.skin-opt').forEach(b =>
    b.classList.toggle('selected', b.dataset.skin === skin));
  try { localStorage.setItem('fa-skin', skin); } catch(e){}
}
(function(){
  let skin = 'mist';
  try { skin = localStorage.getItem('fa-skin') || 'mist'; } catch(e){}
  applySkin(skin);
  document.querySelectorAll('.skin-opt').forEach(b =>
    b.onclick = () => applySkin(b.dataset.skin));
})();

/* ===== 时间 / 日期分隔 ===== */
let lastMsgDay = '';
function localDateStr(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dd;
}
function weekdayOf(ts){ const d=new Date(ts.slice(0,10)+'T12:00:00'); return '日一二三四五六'[d.getDay()]; }
function dayLabel(ts){
  const day=ts.slice(0,10), now=new Date(), today=localDateStr(now);
  const yest=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1), yestStr=localDateStr(yest);
  if(day===today) return '今天';
  if(day===yestStr) return '昨天';
  const y=+ts.slice(0,4),m=+ts.slice(5,7),d=+ts.slice(8,10);
  const year=(y===now.getFullYear())?'':(y+'年');
  return year+m+'月'+d+'日 星期'+weekdayOf(ts);
}
function fmtTime(ts){
  if(!ts) return '';
  const hhmm=ts.slice(11,16), now=new Date(), day=ts.slice(0,10);
  if(day===localDateStr(now)) return hhmm;
  const yest=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
  if(day===localDateStr(yest)) return '昨天 '+hhmm;
  const y=ts.slice(0,4),m=ts.slice(5,7),dd=ts.slice(8,10);
  return (y===String(now.getFullYear()))?(m+'-'+dd+' '+hhmm):(y+'-'+m+'-'+dd+' '+hhmm);
}
function addMsg(m, id){
  if(id){
    if(shownIds.has(id)) return;
    shownIds.add(id);
  }
  const day=m.ts?m.ts.slice(0,10):'';
  if(day && day!==lastMsgDay){
    const div=document.createElement('div');
    div.className='daydiv'; div.textContent=dayLabel(m.ts);
    chat().appendChild(div); lastMsgDay=day;
  }
  const d=document.createElement('div');
  d.className='msg '+(m.role==='user'?'user':'ai');
  const t=fmtTime(m.ts);
  d.innerHTML='<div class="bubble">'+esc(m.content)+'</div>'+(t?'<div class="mtime">'+t+'</div>':'');
  chat().appendChild(d);
  chat().scrollTop=chat().scrollHeight;
}
function addSys(t){
  const d=document.createElement('div');
  d.className='msg sys'; d.textContent=t;
  chat().appendChild(d); chat().scrollTop=chat().scrollHeight;
}

const PHASE_TEXT={idle:'还没开工',working:'忙自己的事',flow:'刚进入状态',break:'歇会儿',off:'今天忙完了',sleep:'睡着'};
function renderState(s){
  const p=s.work||{};
  const ph=$('phase');
  ph.textContent=PHASE_TEXT[p.phase]||'—';
  ph.className='phase '+(p.phase||'');
  const cb=$('cost'); cb.textContent=s.cost?s.cost.badge:''; cb.className='cost '+(s.cost?s.cost.level:'');
  const mb=$('mood'); mb.textContent=s.mood?s.mood.label:''; mb.className='mood '+(s.mood?s.mood.tone:'');
  $('clock').textContent=s.clock||'--:--';
  const e=p.energy||0;
  $('barE').style.width=e+'%'; $('barE2').style.width=e+'%';
  $('barP').style.width=(p.quota?(p.done/p.quota*100):0)+'%';
  $('mQuota').textContent=(p.done||0)+'/'+(p.quota||0);
  $('mEnergy').textContent=e;
  $('mMoney').textContent=p.money||0;
  $('mMat').textContent=(s.materials||0)+' 条';
  $('typing').textContent=s.typing?(s.name+'正在输入…'):'';
  // 朋友档案
  $('pName').textContent=s.name||'—';
  $('crumbName').textContent=s.name||'—';
  $('pDesc').textContent=s.persona?(s.persona.desc||''):'';
  $('pTagsLine').textContent=s.persona?(s.persona.tags||[]).join(' · '):'';
  $('pSch').textContent=s.schedule||'';
  $('pStage').textContent=s.stage||'';
  $('pLink').textContent=s.urgent?'紧急窗口中':(s.presence||s.state||'—');
  $('crumbPill').textContent=s.urgent?'紧急窗口中':(s.presence||s.state||'在线');
  // HUD 状态卡文案
  const st=$('statusText'), ss=$('statusSub');
  if(p.phase==='sleep'){ st.textContent='已经睡着了'; ss.textContent='让它好好休息吧'; }
  else if(p.phase==='working'){ st.textContent='在忙自己的事'; ss.textContent='精力 '+e+' · 不算太打扰'; }
  else if(p.phase==='flow'){ st.textContent='刚进入状态'; ss.textContent='这会儿专注，先别打断'; }
  else if(p.phase==='off'){ st.textContent='今天忙完了'; ss.textContent='闲着，随时能聊'; }
  else if(p.phase==='break'){ st.textContent='歇会儿'; ss.textContent='伸个懒腰，马上回来'; }
  else { st.textContent='现在的状态'; ss.textContent=(s.mood?s.mood.label:'')+(s.cost?(' · '+s.cost.badge):''); }
  // 每日提醒里的名字
  document.querySelectorAll('.quote-card small').forEach(el=>el.textContent='— '+(s.name||'TA')+'的每日提醒');
  const q=$('quoteText'); const idx=new Date().getDate()%QUOTES.length; q.textContent=QUOTES[idx];
  // 防打扰按钮
  const g=$('btnGuard'); g.textContent=s.guard?'防打扰：开':'防打扰：关'; g.classList.toggle('on',!!s.guard);
}

async function poll(){
  try{
    const s=await (await fetch('/api/state')).json();
    renderState(s);
    const m=await (await fetch('/api/messages?after='+lastId)).json();
    (m.messages||[]).forEach(x=>{ addMsg(x,x.id); lastId=Math.max(lastId,x.id); });
    if(m.last_id) lastId=Math.max(lastId,m.last_id);
    if($('streamCard').classList.contains('open')) loadStream();
  }catch(e){ $('pLink').textContent='连接断了，重连中…'; }
}

async function send(){
  const t=$('txt').value.trim();
  if(!t) return;
  $('txt').value='';
  try{
    const r=await (await fetch('/api/send',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:t,urgent:$('urgent').checked})
    })).json();
    $('urgent').checked=false;
    if(r.echo!==false){ addMsg({role:'user',content:t,ts:r.ts},r.id||0); if(r.id) lastId=Math.max(lastId,r.id); }
    if(r.reply) addSys(r.reply);
    poll();
  }catch(e){ addSys('⚠ 发送失败：'+e.message); }
}

/* ===== 命令输出面板 ===== */
function panelBusy(title){ $('pTitle').textContent=title+'…'; $('pOut').textContent='稍等一下'; $('pOut').className='busy'; }
function panelDone(title,text){ $('pTitle').textContent=title; $('pOut').className=''; $('pOut').textContent=text||'(没有输出)'; }
async function runCmd(cmd,title){
  panelBusy(title);
  try{
    const r=await (await fetch('/api/send',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:cmd})
    })).json();
    panelDone(title,r.reply||r.error);
  }catch(e){ panelDone(title,'⚠ '+e.message); }
  poll();
}

/* ===== 朋友列表 ===== */
let curFriend='';
async function loadFriends(){
  try{
    const d=await (await fetch('/api/friends')).json();
    curFriend=d.current||'';
    const box=$('flist'); box.innerHTML='';
    if(!d.friends.length){
      box.innerHTML='<div class="empty">还没有归档的老朋友。抽个新朋友之后，当前这位会出现在这里。</div>';
    } else {
      d.friends.forEach(f=>{
        const row=document.createElement('div');
        row.className='fitem'+(f.name===d.current?' cur':'');
        row.innerHTML='<span class="fname">'+esc(f.name)
          +(f.at?' <span class="fat">· '+esc(f.at)+'</span>':'')+'</span>'
          +'<span class="fop" data-rename="'+f.idx+'">改名</span>'
          +'<span class="fop del" data-del="'+f.idx+'">删除</span>';
        row.querySelector('.fname').onclick=()=>switchFriend(f.idx,f.name);
        row.querySelector('.fop').onclick=(e)=>{ e.stopPropagation(); renameFriend(f.idx,f.name); };
        row.querySelector('.fop.del').onclick=(e)=>{ e.stopPropagation(); deleteFriend(f.idx,f.name); };
        box.appendChild(row);
      });
    }
  }catch(e){ panelDone('朋友列表','⚠ '+e.message); }
}
async function switchFriend(idx,name){
  panelBusy('换朋友');
  const r=await (await fetch('/api/send',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:'/friend '+idx})
  })).json();
  resetChat(); panelDone('换朋友',r.reply||r.error); await loadFriends(); poll();
}
async function deleteFriend(idx,name){
  if(name===curFriend){ panelDone('删除朋友','「'+name+'」是现在正在聊的这位，先换成别人（或抽个新朋友）再来删TA。'); return; }
  if(!confirm('和「'+name+'」告别？\n\nTA 的记忆和日记会先备份，然后从列表里消失。')) return;
  panelBusy('删除朋友');
  const r=await (await fetch('/api/send',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:'/delfriend '+idx+' yes'})
  })).json();
  panelDone('删除朋友',r.reply||r.error); await loadFriends(); poll();
}
async function renameFriend(idx,name){
  const v=prompt('给「'+name+'」改个称呼（只改显示名，不动数据文件）：',name);
  if(!v||!v.trim()||v.trim()===name) return;
  await runCmd('/alias '+idx+' '+v.trim(),'改名'); await loadFriends(); poll();
}
function resetChat(){ chat().innerHTML=''; lastId=0; lastMsgDay=''; shownIds.clear(); }

// 快捷短语 + 侧栏/调试命令按钮
const QUICK=['在吗？','今天过得怎么样','陪我聊聊','有急事找你'];
QUICK.forEach(q=>{
  const b=document.createElement('button'); b.textContent=q;
  b.onclick=()=>{ $('txt').value=q; send(); };
  $('quickReplies').appendChild(b);
});
document.querySelectorAll('.btn[data-cmd]').forEach(b=>{ b.onclick=()=>runCmd(b.dataset.cmd,b.textContent); });

$('btnSwitch').onclick=()=>loadFriends();
$('btnNew').onclick=async()=>{
  panelBusy('抽新朋友');
  const r=await (await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'/new-friend'})})).json();
  resetChat(); panelDone('抽新朋友',r.reply||r.error); await loadFriends(); poll();
};
$('pClear').onclick=()=>panelDone('输出','点上面任意一项，结果会显示在这里（不占聊天区）。');

$('btnRestart2').onclick=()=>restartService();
async function restartService(){
  if(!confirm('重启服务？守护会自动拉起新进程，几秒后回来。')) return;
  panelBusy('重启');
  try{ const r=await (await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'/restart'})})).json(); panelDone('重启',r.reply||r.error); }
  catch(e){ panelDone('重启','⚠ '+e.message); }
}

document.addEventListener('click',(e)=>{ if(!e.target.closest('.menu-wrap')) accMenu.style.display='none'; });

/* ===== 意识流 ===== */
const STREAM_LABEL={inbox:'收',reply:'说',monologue:'想',work:'活',sleep:'眠',wake:'醒'};
async function loadStream(){
  try{
    const d=await (await fetch('/api/stream')).json();
    $('streamDay').textContent=d.day||'';
    const box=$('streamList');
    if(!d.stream||!d.stream.length){ box.innerHTML='<div class="empty">今天 TA 的脑子里还空空的，等 TA 醒着、做点事、想想事，这里就会有内容。</div>'; return; }
    box.innerHTML='';
    d.stream.forEach(r=>{
      const k=STREAM_LABEL[r.kind]||'?';
      const it=document.createElement('div'); it.className='stream-item';
      it.innerHTML='<div class="sk '+r.kind+'">'+k+'</div>'
        +'<div class="st-body"><div class="st-text">'+esc(r.text)+'</div><div class="st-time">'+r.hhmm+'</div></div>';
      box.appendChild(it);
    });
  }catch(e){ $('streamList').innerHTML='<div class="empty">⚠ 拉取意识流失败：'+esc(e.message)+'</div>'; }
}

/* ===== 移动端菜单 ===== */
$('mobileMenu').onclick=()=>loadFriends();

/* ===== 输入框自适应高度 + 发送 ===== */
const txt=$('txt');
txt.addEventListener('input',()=>{ txt.style.height='auto'; txt.style.height=Math.min(txt.scrollHeight,120)+'px'; });
txt.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.nativeEvent.isComposing&&e.keyCode!==229){ e.preventDefault(); send(); }
});
$('send').onclick=send;

poll();
loadFriends();
setInterval(poll,900);
</script>
</body>
</html>
