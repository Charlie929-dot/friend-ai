<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>有生活的朋友 · 网页端</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    /* --- 晨雾（默认，治愈奶油绿） --- */
    --bg: #f3f1ea; --surface: #fbfaf6; --surface-2: #efede4; --line: #e4e1d5;
    --ink: #40473f; --muted: #98a096; --accent: #83a585; --accent-soft: #e3ebe1;
    --me: #83a585; --me-ink: #fff; --shadow: 0 16px 48px rgba(90,104,80,.12);
  }
  .skin-peach {
    --bg: #fbf0e7; --surface: #fffaf5; --surface-2: #f7e9de; --line: #f0ded1;
    --ink: #54473d; --muted: #b09a8d; --accent: #d89a80; --accent-soft: #f6dfd1;
    --me: #d89a80; --me-ink: #fff; --shadow: 0 16px 48px rgba(150,105,80,.12);
  }
  .skin-night {
    --bg: #1c2127; --surface: #262c33; --surface-2: #2e3540; --line: #39424d;
    --ink: #edf0ea; --muted: #9ca8a6; --accent: #a3c2a0; --accent-soft: #364439;
    --me: #a3c2a0; --me-ink: #16200f; --shadow: 0 16px 48px rgba(0,0,0,.35);
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); transition: background .35s, color .35s; overflow: hidden; }
  button, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: transparent; }
  svg { display: block; }

  /* ===== 单栏骨架（固定视口，聊天流内部滚动 —— 治「越聊越长」） ===== */
  .app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--ink); transition: background .35s, color .35s; }

  /* --- 顶部状态条 --- */
  .topbar { display: flex; align-items: center; gap: 10px; height: 62px; padding: 0 16px;
    flex: 0 0 auto; }
  .icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px;
    color: var(--muted); transition: background .18s, color .18s; flex: 0 0 auto; }
  .icon-btn:hover { background: var(--surface-2); color: var(--accent); }
  .friend-head { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center;
    color: var(--accent); background: var(--accent-soft); flex: 0 0 auto; }
  .fh-body { min-width: 0; }
  .fh-name { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; }
  .fh-name .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); flex: 0 0 auto; }
  .fh-status { margin-top: 1px; font-size: 11.5px; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .avatar-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 13px; flex: 0 0 auto; box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 30%, transparent); }

  /* 账户菜单 */
  .menu-wrap { position: relative; flex: 0 0 auto; }
  .account-menu { position: absolute; right: 0; top: 46px; z-index: 60; width: 218px; padding: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .account-menu .menu-sec { padding: 6px 8px 8px; color: var(--muted); font-size: 10px; letter-spacing: .05em; }
  .skin-row { display: flex; gap: 6px; padding: 0 8px 6px; }
  .skin-opt { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 4px;
    background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; font-size: 10px; color: var(--muted); }
  .skin-opt i { width: 18px; height: 18px; border-radius: 50%; }
  .skin-opt.selected { border-color: var(--accent); color: var(--ink); }
  .menu-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px; color: var(--ink);
    border-radius: 9px; font-size: 12.5px; text-align: left; }
  .menu-item:hover { background: var(--surface-2); }
  .menu-item svg { color: var(--muted); }
  .menu-item:hover svg { color: var(--accent); }
  .menu-div { height: 1px; background: var(--line); margin: 5px 6px; }
  .menu-item.danger { color: #d98a8a; }
  .menu-item.danger svg { color: #d98a8a; }

  /* --- 聊天流（内部滚动，不撑高页面） --- */
  .chat { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 18px 8px; }
  .chat-inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; }
  .daydiv { align-self: center; background: var(--surface-2); color: var(--muted); font-size: 11px;
    padding: 4px 12px; border-radius: 12px; margin: 10px 0 4px; }
  .msg { display: flex; flex-direction: column; width: 100%; margin: 4px 0; position: relative; animation: fadeUp .28s ease; }
  .msg.ai { align-items: flex-start; }
  .msg.user { align-items: flex-end; }
  .msg.sys { align-self: center; color: var(--muted); font-size: 11px; text-align: center;
    white-space: pre-wrap; line-height: 1.6; font-family: ui-monospace, Consolas, monospace; max-width: 92%; }
  .bubble-row { position: relative; max-width: 78%; }
  .bubble { padding: 10px 15px; border-radius: 8px 16px 16px 16px; font-size: 14px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word; }
  .msg.ai .bubble { background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .msg.user .bubble { background: var(--me); color: var(--me-ink); border-radius: 16px 8px 16px 16px; }
  .mtime { font-size: 10px; color: var(--muted); margin-top: 3px; padding: 0 4px; }
  .typing { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; margin: 6px 2px; }
  .typing-bubble { display: flex; gap: 3px; padding: 9px 11px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px 13px 13px 13px; }
  .typing-bubble i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); animation: bounce 1s infinite; }
  .typing-bubble i:nth-child(2) { animation-delay: .15s; }
  .typing-bubble i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-3px); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* --- 输入区 --- */
  .composer-wrap { flex: 0 0 auto; padding: 8px 18px calc(10px + env(safe-area-inset-bottom)); }
  .composer-inner { max-width: 720px; margin: 0 auto; }
  .composer { display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.04); }
  .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .composer textarea { flex: 1; min-height: 24px; max-height: 120px; padding: 6px 0; color: var(--ink);
    background: transparent; border: 0; outline: 0; resize: none; font-size: 14px; }
  .composer textarea::placeholder { color: var(--muted); }
  .send-btn { width: 38px; height: 38px; display: grid; place-items: center; color: #fff; background: var(--accent);
    border-radius: 12px; flex: 0 0 auto; transition: transform .08s, filter .15s; }
  .send-btn:hover { filter: brightness(1.06); }
  .send-btn:active { transform: scale(.92); }
  .composer-foot { display: flex; justify-content: space-between; align-items: center; padding: 7px 4px 0;
    color: var(--muted); font-size: 10.5px; }
  .urgent-toggle { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .urgent-toggle input { accent-color: var(--accent); width: 13px; height: 13px; }

  /* ===== 抽屉 + 遮罩 ===== */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.28); opacity: 0;
    pointer-events: none; transition: opacity .25s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 50; width: 300px; max-width: 86vw;
    display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line);
    box-shadow: var(--shadow); transform: translateX(-102%); transition: transform .28s ease; }
  .drawer.right { left: auto; right: 0; border-right: 0; border-left: 1px solid var(--line);
    transform: translateX(102%); }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 12px;
    font-size: 14px; font-weight: 600; flex: 0 0 auto; }
  .drawer-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 18px 20px; }

  /* 左抽屉：朋友 */
  .friend-card { padding: 13px; background: var(--surface-2); border-radius: 15px; margin-bottom: 14px; }
  .fc-top { display: flex; align-items: center; gap: 10px; }
  .fc-top .avatar { width: 38px; height: 38px; }
  .fc-top h2 { font-size: 14.5px; display: flex; align-items: center; gap: 6px; }
  .fc-top p { margin-top: 2px; color: var(--muted); font-size: 11px; }
  .live-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; color: var(--accent);
    background: var(--accent-soft); border-radius: 99px; font-size: 10px; }
  .live-pill i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .fc-row { display: flex; justify-content: space-between; margin-top: 10px; font-size: 11px; color: var(--muted); }
  .fc-row b { color: var(--ink); font-weight: 600; }
  .side-label { padding: 8px 2px 8px; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
  .flist { display: flex; flex-direction: column; gap: 4px; }
  .fitem { display: flex; align-items: center; gap: 9px; padding: 8px 9px; border-radius: 11px;
    font-size: 12px; color: var(--muted); position: relative; }
  .fitem:hover { background: var(--surface-2); color: var(--ink); }
  .fitem.cur { background: var(--surface-2); color: var(--ink); }
  .fitem.cur::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px;
    border-radius: 99px; background: var(--accent); }
  .favatar { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; }
  .favatar.c0 { color: #4eae78; background: color-mix(in srgb, #4eae78 16%, transparent); }
  .favatar.c1 { color: #d97a7a; background: color-mix(in srgb, #d97a7a 16%, transparent); }
  .favatar.c2 { color: #d8a03b; background: color-mix(in srgb, #d8a03b 16%, transparent); }
  .favatar.c3 { color: #5b7fd8; background: color-mix(in srgb, #5b7fd8 16%, transparent); }
  .favatar.c4 { color: #9a6fd8; background: color-mix(in srgb, #9a6fd8 16%, transparent); }
  .favatar.c5 { color: #4fa8a8; background: color-mix(in srgb, #4fa8a8 16%, transparent); }
  .fitem .fbody { flex: 1; min-width: 0; }
  .fitem .fname { display: block; cursor: pointer; line-height: 1.3; }
  .fitem .fnote { display: block; margin-top: 1px; font-size: 10px; color: var(--muted); }
  .fitem .fop { font-size: 10.5px; color: var(--muted); cursor: pointer; padding: 0 2px; }
  .fitem .fop:hover { color: var(--accent); }
  .fitem .fop.del:hover { color: #e07a7a; }
  .empty { font-size: 11.5px; color: var(--muted); padding: 8px 2px; line-height: 1.6; }
  .new-friend-btn { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%;
    padding: 11px; margin-top: 12px; border: 1px dashed var(--line); border-radius: 12px; color: var(--accent);
    font-size: 12.5px; transition: background .18s; }
  .new-friend-btn:hover { background: var(--accent-soft); }

  /* 右抽屉：洞察 */
  .insight-card { padding: 15px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    margin-bottom: 12px; }
  .phase-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; }
  .phase.working { color: #d8a03b; } .phase.flow { color: #d98ab8; } .phase.free { color: #4eae78; }
  .phase.off { color: #4eae78; } .phase.idle { color: #8a8fc0; } .phase.break { color: #9a6fd8; }
  .phase.sleep { color: #8a8fc0; }
  .badge { display: inline-block; font-size: 10px; border-radius: 6px; padding: 1px 7px; vertical-align: middle; }
  .cost.welcomed { color: #4eae78; border: 1px solid #4eae78; }
  .cost.tolerated { color: #d8a03b; border: 1px solid #d8a03b; }
  .cost.costly { color: #d97a7a; border: 1px solid #d97a7a; }
  .cost.sleep { color: #8a8fc0; border: 1px solid #8a8fc0; }
  .mood.positive { color: #4eae78; border: 1px solid #4eae78; }
  .mood.neutral { color: #8a8fc0; border: 1px solid #8a8fc0; }
  .mood.tired { color: #d8a03b; border: 1px solid #d8a03b; }
  .mood.sleep { color: #8a8fc0; border: 1px solid #8a8fc0; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 13px; }
  .stat { background: var(--surface-2); border-radius: 12px; padding: 10px 11px; }
  .stat .s-label { font-size: 10px; color: var(--muted); }
  .stat .s-val { font-size: 16px; font-weight: 700; margin-top: 3px; }
  .stat .s-val em { font-style: normal; }
  .stat .s-val .q-den { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 1px; }
  .stat .s-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .mini-bar { height: 5px; margin-top: 7px; overflow: hidden; background: var(--line); border-radius: 99px; }
  .mini-bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .4s; }
  .mini-bar.e > i { background: #4eae78; } .mini-bar.p > i { background: #6bb8ff; }
  .quote-card { padding: 14px; color: var(--accent); background: var(--accent-soft); border-radius: 14px; margin-bottom: 12px; }
  .quote-card p { margin: 8px 0 6px; color: var(--ink); font-size: 12px; line-height: 1.7; }
  .quote-card small { color: var(--muted); font-size: 10px; }
  .memory-card { padding: 15px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; }
  .card-title { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
  .memory-card p { margin: 11px 0 0; color: var(--ink); font-size: 12px; line-height: 1.6; }
  .memory-card p + p { padding-top: 9px; border-top: 1px solid var(--line); }
  .memory-card .mem-empty { color: var(--muted); }
  .memory-card a { display: inline-block; margin-top: 11px; color: var(--accent); font-size: 11px; cursor: pointer; }

  /* 折叠区（意识流 / 调试） */
  details.fold { margin-bottom: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  details.fold summary { list-style: none; padding: 13px 15px; font-size: 12.5px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 7px; user-select: none; }
  details.fold summary::-webkit-details-marker { display: none; }
  details.fold summary::after { content: '›'; margin-left: auto; color: var(--muted); font-size: 16px;
    transition: transform .2s; }
  details.fold[open] summary::after { transform: rotate(90deg); }
  details.fold .fold-body { padding: 0 15px 15px; }
  .stream-list { display: flex; flex-direction: column; gap: 9px; max-height: 300px; overflow: auto; }
  .stream-item { display: flex; gap: 9px; font-size: 11.5px; }
  .stream-item .sk { flex: 0 0 auto; width: 16px; height: 16px; border-radius: 5px; margin-top: 2px;
    display: grid; place-items: center; font-size: 9px; color: #fff; }
  .sk.inbox { background: #6bb8ff; } .sk.reply { background: var(--accent); }
  .sk.monologue { background: #9a6fd8; } .sk.work { background: #d8a03b; }
  .sk.sleep { background: #8a8fc0; } .sk.wake { background: #4eae78; }
  .stream-item .st-body { flex: 1; }
  .stream-item .st-text { color: var(--ink); line-height: 1.55; }
  .stream-item .st-time { color: var(--muted); font-size: 10px; margin-top: 2px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); border-radius: 10px;
    padding: 8px 9px; font-size: 11.5px; text-align: center; transition: background .15s, border-color .15s; }
  .btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.warn { color: #d98a8a; }
  .btnrow { display: flex; gap: 8px; margin-top: 10px; }
  .btnrow .btn { flex: 1; }
  .panel { background: var(--surface-2); border-radius: 12px; padding: 11px; margin-top: 12px; max-height: 260px; overflow: auto; }
  .panel pre { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--ink);
    white-space: pre-wrap; line-height: 1.6; }
  .panel .ph { display: flex; justify-content: space-between; align-items: center; font-size: 11px;
    color: var(--muted); margin-bottom: 7px; }
  .panel .ph .clr { cursor: pointer; }
  .panel .ph .clr:hover { color: var(--accent); }
  .panel .ph .ph-actions { display: flex; gap: 14px; }
  .busy { color: #d8a03b; }

  /* --- 直达底部按钮 + 新消息提示（往上翻时出现） --- */
  .to-bottom { position: fixed; right: 20px; bottom: 128px; z-index: 30; width: 42px; height: 42px;
    border-radius: 50%; background: var(--surface); border: 1px solid var(--line); color: var(--accent);
    box-shadow: var(--shadow); display: none; place-items: center; cursor: pointer;
    transition: transform .08s; }
  .to-bottom.show { display: grid; animation: fadeUp .2s ease; }
  .to-bottom:active { transform: scale(.92); }
  .to-bottom .tb-badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px;
    padding: 0 4px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 10px;
    display: grid; place-items: center; font-weight: 600; }
  .new-msg-toast { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); z-index: 30;
    display: none; align-items: center; gap: 7px; padding: 8px 15px; border-radius: 99px;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 12px;
    box-shadow: var(--shadow); cursor: pointer; }
  .new-msg-toast.show { display: flex; animation: fadeUp .22s ease; }
  .new-msg-toast .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

  /* --- 对话引用 --- */
  .quote-bar { display: none; align-items: center; gap: 10px; margin-bottom: 8px; padding: 8px 12px;
    background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 12px; box-shadow: 0 1px 5px rgba(0,0,0,.03); }
  .quote-bar.show { display: flex; animation: fadeUp .18s ease; }
  .qb-body { flex: 1; min-width: 0; }
  .qb-who { font-size: 10.5px; color: var(--accent); margin-bottom: 2px; }
  .qb-text { font-size: 12.5px; color: var(--ink); line-height: 1.5; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .qb-close { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    color: var(--muted); font-size: 15px; line-height: 1; }
  .qb-close:hover { background: var(--surface-2); color: var(--ink); }
  .bubble .bubble-quote { margin-bottom: 6px; padding: 5px 9px; border-left: 2.5px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 6px; font-size: 12px;
    line-height: 1.5; color: var(--muted); white-space: pre-wrap; word-break: break-word;
    max-height: 60px; overflow: hidden; }
  .msg.user .bubble .bubble-quote { border-left-color: rgba(255,255,255,.75);
    background: rgba(255,255,255,.22); color: var(--me-ink); }
  /* 消息行 hover 时整条消息提到最上层：工具条会溢出短消息的高度（竖排按钮更高），
     不提升 z-index 会被下一条消息的气泡盖住、点不到 */
  .msg:hover { z-index: 30; }
  .msg-actions { position: absolute; top: 0; display: flex; flex-direction: column; gap: 4px;
    opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 1; }
  .msg.ai .msg-actions { left: calc(100% + 6px); }
  .msg.user .msg-actions { right: calc(100% + 6px); }
  .msg:hover .msg-actions, .msg-actions:hover, .msg-actions:focus-within { opacity: 1; pointer-events: auto; }
  .ma-btn { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    box-shadow: 0 2px 6px rgba(0,0,0,.08); transition: color .15s, border-color .15s, background .15s; }

/* ===== 时间 / 日期分隔 ===== */
let lastMsgDay = '';
function localDateStr(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dd;
}
function weekdayOf(ts){ const d=new Date(ts.slice(0,10)+'T12:00:00'); return '日一二三四五六'[d.getDay()]; }
function dayLabel(ts){
  const day=ts.slice(0,10), now=new Date(), today=localDateStr(now);
  const yest=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1), yestStr=localDateStr(yest);
  if(day===today) return '今天';
  if(day===yestStr) return '昨天';
  const y=+ts.slice(0,4),m=+ts.slice(5,7),d=+ts.slice(8,10);
  const year=(y===now.getFullYear())?'':(y+'年');
  return year+m+'月'+d+'日 星期'+weekdayOf(ts);
}
function fmtTime(ts){
  if(!ts) return '';
  const hhmm=ts.slice(11,16), now=new Date(), day=ts.slice(0,10);
  if(day===localDateStr(now)) return hhmm;
  const yest=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
  if(day===localDateStr(yest)) return '昨天 '+hhmm;
  const y=ts.slice(0,4),m=ts.slice(5,7),dd=ts.slice(8,10);
  return (y===String(now.getFullYear()))?(m+'-'+dd+' '+hhmm):(y+'-'+m+'-'+dd+' '+hhmm);
}
/* ===== 滚动 / 新消息提示 ===== */
const chatEl = () => $('chat');
function isNearBottom(){ const el=chatEl(); return el.scrollHeight - el.scrollTop - el.clientHeight < 80; }
let toastTimer = null;
function hideToast(){ $('newMsgToast').classList.remove('show'); }
function showToast(){
  $('newMsgToast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 2600);
}
function scrollToBottom(smooth){
  const el=chatEl();
  if(smooth){ el.scrollTo({top:el.scrollHeight, behavior:'smooth'}); }
  else { el.scrollTop = el.scrollHeight; }
  unread=0; $('tbBadge').style.display='none';
  $('toBottom').classList.remove('show'); hideToast();
}
let unread = 0;
function afterAppend(){
  // 在底部附近 → 跟着滚到底；往上翻了 → 不动，只亮"直达底部"+弹新消息提示
  if(isNearBottom()){ scrollToBottom(false); }
  else {
    unread++;
    const b=$('tbBadge'); b.textContent=unread; b.style.display='grid';
    $('toBottom').classList.add('show'); showToast();
  }
}
chatEl().addEventListener('scroll',()=>{
  if(isNearBottom()){ unread=0; $('tbBadge').style.display='none'; $('toBottom').classList.remove('show'); hideToast(); }
  else { $('toBottom').classList.add('show'); }
});
$('toBottom').onclick=()=>scrollToBottom(true);
$('newMsgToast').onclick=()=>scrollToBottom(true);

/* ===== 对话引用 ===== */
function setQuote(id){
  const m=msgMeta.get(id);
  if(!m) return;
  quote={id, role:m.role, content:m.content};
  renderQuoteBar();
}
function clearQuote(){ quote=null; renderQuoteBar(); }
function renderQuoteBar(){
  const bar=$('quoteBar');
  if(!quote){ bar.classList.remove('show'); return; }
  $('quoteWho').textContent = quote.role==='user' ? '引用你的消息' : '引用 TA 的消息';
  $('quoteContent').textContent = quote.content;
  bar.classList.add('show');
}
$('quoteClose').onclick=clearQuote;

/* ===== 通用 toast / 复制 ===== */
let toastTimer2 = null;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer2);
  toastTimer2=setTimeout(()=>t.classList.remove('show'),1800);
}
async function copyText(text, okMsg){
  if(!text){ toast('没有可复制的内容'); return; }
  try { await navigator.clipboard.writeText(text); toast(okMsg||'已复制'); }
  catch(e){
    // 剪贴板 API 不可用（非安全上下文）时兜底
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(okMsg||'已复制'); }
    catch(e2){ toast('复制失败，请手动复制'); }
    document.body.removeChild(ta);
  }
}

function updateSelectBar(){ $('selCount').textContent='已选 '+selected.size+' 条'; }
function toggleSelect(id){
  if(selected.has(id)) selected.delete(id); else selected.add(id);
  refreshSelect(); updateSelectBar();
}
function enterSelect(firstId){
  selectMode=true; selected.clear();
  if(firstId) selected.add(firstId);
  $('app').classList.add('selecting');
  $('selectBar').classList.add('show');
  refreshSelect(); updateSelectBar();
}
function exitSelect(){
  selectMode=false; selected.clear();
  $('app').classList.remove('selecting');
  $('selectBar').classList.remove('show');
  refreshSelect();
}
function copySelected(){
  const ids=[...selected].sort((a,b)=>a-b);
  if(!ids.length){ toast('先点选几条消息'); return; }
  const lines=ids.map(id=>{
    const m=msgMeta.get(id); if(!m) return '';
    const who=m.role==='user'?'你':(curName||'TA');
    return who+'：'+m.content;
  }).filter(Boolean);
  copyText(lines.join('\n'), '已复制 '+lines.length+' 条');
  exitSelect();
}
$('selCopy').onclick=copySelected;
$('selCancel').onclick=exitSelect;

/* ===== 右键菜单 ===== */
let ctxMenu=null;
function hideCtx(){ if(ctxMenu){ ctxMenu.remove(); ctxMenu=null; } }
function onMsgContext(e, id, m){
  e.preventDefault(); hideCtx();
  ctxMenu=document.createElement('div');
  ctxMenu.className='ctx-menu';
  const items=[['copy','复制',()=>copyText(m.content)],['quote','引用',()=>setQuote(id)]];
  if(m.role==='user') items.push(['revoke','撤回',()=>revokeMsg(id)]);
  items.push(['multi','多选',()=>enterSelect(id)]);
  items.forEach(([k,label,fn])=>{
    const b=document.createElement('button');
    b.className='ctx-item'+(k==='revoke'?' danger':'');
    b.textContent=label;
    b.onclick=()=>{ hideCtx(); fn(); };
    ctxMenu.appendChild(b);
  });
  document.body.appendChild(ctxMenu);
  const w=ctxMenu.offsetWidth||116, h=ctxMenu.offsetHeight||120;
  let x=e.clientX, y=e.clientY;
  if(x+w>window.innerWidth-8) x=window.innerWidth-w-8;
  if(y+h>window.innerHeight-8) y=window.innerHeight-h-8;
  ctxMenu.style.left=x+'px'; ctxMenu.style.top=y+'px';
}
document.addEventListener('click', hideCtx);
document.addEventListener('contextmenu', e=>{ if(!e.target.closest('.msg')) hideCtx(); });

function addMsg(m, id){
  if(id){
    if(shownIds.has(id)) return;
    shownIds.add(id);
  }
  const day=m.ts?m.ts.slice(0,10):'';
  if(day && day!==lastMsgDay){
    const div=document.createElement('div');
    div.className='daydiv'; div.textContent=dayLabel(m.ts);
    chat().appendChild(div); lastMsgDay=day;
  }
  const d=document.createElement('div');
  d.className='msg '+(m.role==='user'?'user':'ai');
  if(id) d.dataset.mid=id;
  const t=fmtTime(m.ts);
  const q=m.quote_content?'<div class="bubble-quote">'+esc(m.quote_content)+'</div>':'';
  // 消息行操作按钮：引用 / 复制（/ 撤回，仅用户消息）。hover 整条消息行即出现（.msg 占满整行宽）
  const acts = id ? '<div class="msg-actions">'
    +'<button class="ma-btn" data-act="quote" title="引用"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M10 7H6a3 3 0 0 0-3 3v7h7v-7H7a1 1 0 0 1 1-2h2V7zm10 0h-4a3 3 0 0 0-3 3v7h7v-7h-3a1 1 0 0 1 1-2h2V7z"/></svg></button>'
    +'<button class="ma-btn" data-act="copy" title="复制"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>'
    +(m.role==='user'?'<button class="ma-btn danger" data-act="revoke" title="撤回"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>':'')
    +'</div>' : '';
  d.innerHTML='<div class="bubble-row"><div class="bubble">'+q+esc(m.content)+'</div>'+acts+'</div>'+(t?'<div class="mtime">'+t+'</div>':'');
  chat().appendChild(d);
  if(id){
    msgMeta.set(id, {role:m.role, content:m.content});
    const row=d.querySelector('.bubble-row');
    d.querySelectorAll('.ma-btn').forEach(b=>{
      b.onclick=(e)=>{ e.stopPropagation(); const a=b.dataset.act;
        if(a==='quote') setQuote(id);
        else if(a==='copy') copyText(m.content);
        else if(a==='revoke') revokeMsg(id);
      };
    });
    row.addEventListener('contextmenu', e=>onMsgContext(e, id, m));
    row.addEventListener('click', e=>{ if(selectMode){ e.stopPropagation(); toggleSelect(id); } });
  }
  afterAppend();
}
function addSys(t){
  const d=document.createElement('div');
  d.className='msg sys'; d.textContent=t;
  chat().appendChild(d); afterAppend();
}

const PHASE_TEXT={idle:'还没开工',working:'忙自己的事',flow:'刚进入状态',break:'歇会儿',off:'今天忙完了',sleep:'睡着'};
function renderState(s){
  const p=s.work||{};
  const ph=$('phase');
  ph.textContent=PHASE_TEXT[p.phase]||'—';
  ph.className='phase '+(p.phase||'');
  const cb=$('cost'); cb.textContent=s.cost?s.cost.badge:''; cb.className='cost '+(s.cost?s.cost.level:'');
  const mb=$('mood'); mb.textContent=s.mood?s.mood.label:''; mb.className='mood '+(s.mood?s.mood.tone:'');
  const e=p.energy||0;
  $('barE').style.width=e+'%';
  $('barP').style.width=(p.quota?(p.done/p.quota*100):0)+'%';
  $('qDone').textContent=(p.done||0);
  $('qQuota').textContent='/'+(p.quota||0);
  $('mEnergy').textContent=e;
  $('mMoney').textContent=p.money||0;
  $('mMat').textContent=(s.materials||0)+' 条';
  $('typing').textContent=s.typing?(s.name+'正在输入…'):'';
  // 朋友档案
  $('pName').textContent=s.name||'—';
  curName=s.name||'';
  $('pCardName').textContent=s.name||'—';
  $('pDesc').textContent=s.persona?(s.persona.desc||''):'';
  $('pSch').textContent=s.schedule||'';
  $('pStage').textContent=s.stage||'';
  $('pLink').textContent=s.urgent?'紧急窗口中':(s.presence||s.state||'—');
  // 顶部状态条文案（实时交互感的核心：状态即时反映在这里）
  const st=$('statusText');
  if(p.phase==='sleep'){ st.textContent='已经睡着了 · 让它好好休息'; }
  else if(p.phase==='working'){ st.textContent='在忙自己的事 · 精力 '+e; }
  else if(p.phase==='flow'){ st.textContent='刚进入状态 · 这会儿专注'; }
  else if(p.phase==='off'){ st.textContent='今天忙完了 · 随时能聊'; }
  else if(p.phase==='break'){ st.textContent='歇会儿 · 伸个懒腰'; }
  else { st.textContent=(s.presence||'在线')+(s.mood?(' · '+s.mood.label):''); }
  // 每日提醒
  $('quoteBy').textContent='— '+(s.name||'TA')+'的每日提醒';
  $('quoteText').textContent=QUOTES[new Date().getDate()%QUOTES.length];
  // 防打扰按钮
  const g=$('btnGuard'); g.textContent=s.guard?'防打扰：开':'防打扰：关'; g.classList.toggle('on',!!s.guard);
}

async function poll(){
  try{
    const s=await (await fetch('/api/state')).json();
    renderState(s);
    const m=await (await fetch('/api/messages?after='+lastId)).json();
    (m.messages||[]).forEach(x=>{ addMsg(x,x.id); lastId=Math.max(lastId,x.id); });
    if(m.last_id) lastId=Math.max(lastId,m.last_id);
    if($('foldStream').open) loadStream();
  }catch(e){ $('statusText').textContent='连接断了，重连中…'; }
}

async function send(){
  const t=$('txt').value.trim();
  if(!t) return;
  $('txt').value=''; $('txt').style.height='auto';
  const q=quote;
  clearQuote();
  try{
    const body={text:t, urgent:$('urgent').checked};
    if(q) body.quote={id:q.id, role:q.role, content:q.content};
    const r=await (await fetch('/api/send',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    })).json();
    $('urgent').checked=false;
    if(r.echo!==false){
      addMsg({role:'user',content:t,ts:r.ts,quote_content:q?q.content:''},r.id||0);
      if(r.id) lastId=Math.max(lastId,r.id);
    }
    if(r.reply) addSys(r.reply);
    poll();
  }catch(e){ addSys('⚠ 发送失败：'+e.message); }
}

/* ===== 命令输出面板 ===== */
function panelBusy(title){ $('pTitle').textContent=title+'…'; $('pOut').textContent='稍等一下'; $('pOut').className='busy'; }
function panelDone(title,text){ $('pTitle').textContent=title; $('pOut').className=''; $('pOut').textContent=text||'(没有输出)'; }
async function runCmd(cmd,title){
  panelBusy(title);
  try{
    const r=await (await fetch('/api/send',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:cmd})
    })).json();
    panelDone(title,r.reply||r.error);
  }catch(e){ panelDone(title,'⚠ '+e.message); }
  poll();
}

/* ===== 朋友列表 ===== */
let curFriend='';
async function loadFriends(){
  try{
    const d=await (await fetch('/api/friends')).json();
    curFriend=d.current||'';
    const box=$('flist'); box.innerHTML='';
    if(!d.friends.length){
      box.innerHTML='<div class="empty">还没有归档的老朋友。抽个新朋友之后，当前这位会出现在这里。</div>';
    } else {
      d.friends.forEach(f=>{
        const row=document.createElement('div');
        row.className='fitem'+(f.name===d.current?' cur':'');
        const ci=(f.idx||0)%6;
        row.innerHTML='<div class="favatar c'+ci+'">'+esc((f.name||'?').slice(0,1))+'</div>'
          +'<div class="fbody"><span class="fname">'+esc(f.name)+'</span>'
          +(f.at?'<span class="fnote">'+esc(f.at)+'</span>':'')+'</div>'
          +'<span class="fop" data-rename="'+f.idx+'">改名</span>'
          +'<span class="fop del" data-del="'+f.idx+'">删除</span>';
        row.querySelector('.fname').onclick=()=>switchFriend(f.idx,f.name);
        row.querySelector('.fop').onclick=(e)=>{ e.stopPropagation(); renameFriend(f.idx,f.name); };
        row.querySelector('.fop.del').onclick=(e)=>{ e.stopPropagation(); deleteFriend(f.idx,f.name); };
        box.appendChild(row);
      });
    }
  }catch(e){ panelDone('朋友列表','⚠ '+e.message); }
}
async function switchFriend(idx,name){
  panelBusy('换朋友');
  const r=await (await fetch('/api/send',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:'/friend '+idx})
  })).json();
  resetChat(); panelDone('换朋友',r.reply||r.error); await loadFriends(); poll(); closeDrawer('L');
}
async function deleteFriend(idx,name){
  if(name===curFriend){ panelDone('删除朋友','「'+name+'」是现在正在聊的这位，先换成别人（或抽个新朋友）再来删TA。'); return; }
  if(!confirm('和「'+name+'」告别？\n\nTA 的记忆和日记会先备份，然后从列表里消失。')) return;
  panelBusy('删除朋友');
  const r=await (await fetch('/api/send',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:'/delfriend '+idx+' yes'})
  })).json();
  panelDone('删除朋友',r.reply||r.error); await loadFriends(); poll();
}
async function renameFriend(idx,name){
  const v=prompt('给「'+name+'」改个称呼（只改显示名，不动数据文件）：',name);
  if(!v||!v.trim()||v.trim()===name) return;
  await runCmd('/alias '+idx+' '+v.trim(),'改名'); await loadFriends(); poll();
}
function resetChat(){ chat().innerHTML=''; lastId=0; lastMsgDay=''; shownIds.clear(); msgMeta.clear(); clearQuote(); if(selectMode) exitSelect(); scrollToBottom(false); }

document.querySelectorAll('.btn[data-cmd]').forEach(b=>{ b.onclick=()=>runCmd(b.dataset.cmd,b.textContent); });
$('btnGuard').onclick=()=>{ const on=$('btnGuard').classList.contains('on'); runCmd(on?'/guard off':'/guard on','防打扰'); };
$('btnNew').onclick=async()=>{
  panelBusy('抽新朋友');
  const r=await (await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'/new-friend'})})).json();
  resetChat(); panelDone('抽新朋友',r.reply||r.error); await loadFriends(); poll(); closeDrawer('L');
};
$('pClear').onclick=()=>panelDone('输出','点上面任意一项，结果会显示在这里。');
$('pCopy').onclick=()=>copyText($('pOut').textContent);
$('btnRestart2').onclick=()=>restartService();
async function restartService(){
  if(!confirm('重启服务？守护会自动拉起新进程，几秒后回来。')) return;
  panelBusy('重启');
  try{ const r=await (await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'/restart'})})).json(); panelDone('重启',r.reply||r.error); }
  catch(e){ panelDone('重启','⚠ '+e.message); }
}

/* ===== 账户菜单 ===== */
const accMenu=$('accountMenu');
$('avatarBtn').onclick=(e)=>{ e.stopPropagation(); accMenu.style.display=accMenu.style.display==='none'?'block':'none'; };
document.addEventListener('click',(e)=>{ if(!e.target.closest('.menu-wrap')) accMenu.style.display='none'; });
$('mHelp').onclick=()=>{ accMenu.style.display='none'; openDrawer('R'); $('foldDebug').open=true; runCmd('/help','帮助'); };
$('mRestart').onclick=()=>restartService();

/* ===== 记忆卡 ===== */
async function loadMemories(){
  try{
    const d=await (await fetch('/api/memories')).json();
    const box=$('memList');
    if(!d.recent||!d.recent.length){
      box.innerHTML='<p class="mem-empty">还没记住什么，聊着聊着就有了。</p>';
    }else{
      box.innerHTML=d.recent.map(m=>'<p>'+esc(m.content)+'</p>').join('');
    }
    $('mMemAll').textContent='查看全部记忆'+(d.total?('（'+d.total+'）'):'')+' →';
  }catch(e){ $('memList').innerHTML='<p class="mem-empty">⚠ 拉取失败：'+esc(e.message)+'</p>'; }
}
$('mMemRefresh').onclick=()=>loadMemories();
$('mMemAll').onclick=()=>{ $('foldDebug').open=true; runCmd('/memories','TA 记住的事'); };

/* ===== 意识流 ===== */
const STREAM_LABEL={inbox:'收',reply:'说',monologue:'想',work:'活',sleep:'眠',wake:'醒'};
async function loadStream(){
  try{
    const d=await (await fetch('/api/stream')).json();
    $('streamDay').textContent=d.day?(' · '+d.day):'';
    const box=$('streamList');
    if(!d.stream||!d.stream.length){ box.innerHTML='<div class="empty">今天 TA 的脑子里还空空的，等 TA 醒着、做点事、想想事，这里就会有内容。</div>'; return; }
    box.innerHTML='';
    d.stream.forEach(r=>{
      const k=STREAM_LABEL[r.kind]||'?';
      const it=document.createElement('div'); it.className='stream-item';
      it.innerHTML='<div class="sk '+r.kind+'">'+k+'</div>'
        +'<div class="st-body"><div class="st-text">'+esc(r.text)+'</div><div class="st-time">'+r.hhmm+'</div></div>';
      box.appendChild(it);
    });
  }catch(e){ $('streamList').innerHTML='<div class="empty">⚠ 拉取意识流失败：'+esc(e.message)+'</div>'; }
}
$('foldStream').addEventListener('toggle',()=>{ if($('foldStream').open) loadStream(); });

/* ===== 输入框自适应 + 发送 ===== */
const txt=$('txt');
txt.addEventListener('input',()=>{ txt.style.height='auto'; txt.style.height=Math.min(txt.scrollHeight,120)+'px'; });
txt.addEventListener('keydown',e=>{
  // Enter 发送 · Shift+Enter 换行。用标准 e.isComposing（输入法组字中不触发发送）；
  // 之前误用 e.nativeEvent（React 概念）会抛 TypeError，导致 Enter 整个失效、退回默认换行。
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); send(); }
});
$('send').onclick=send;

poll();
loadFriends();
loadMemories();
setInterval(poll,900);
setInterval(loadMemories,30000);
</script>
