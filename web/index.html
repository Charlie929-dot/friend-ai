<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有生活的朋友 · 网页端</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#1b1d29; color:#e8e8ef; display:flex; justify-content:center;
    padding:20px; gap:20px; flex-wrap:wrap; }
  .phone { width:420px; background:#232634; border-radius:28px; padding:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.45); display:flex; flex-direction:column;
    height:min(760px, calc(100vh - 40px)); }
  /* --- HUD：常驻可见才会自发尊重它的边界（参考原型布局） --- */
  .hud { background:#2c2f42; border-radius:16px; padding:10px 12px; margin-bottom:8px; }
  .hud-top { display:flex; justify-content:space-between; align-items:center; font-size:13px; }
  .clock { color:#9aa0c0; font-variant-numeric:tabular-nums; }
  .phase { font-weight:600; }
  .phase.working{color:#ffcf6b} .phase.flow{color:#ff9ecb} .phase.free{color:#7ee0a8}
  .phase.off{color:#7ee0a8} .phase.idle{color:#8a8fc0} .phase.break{color:#c0a8ff}
  .phase.sleep{color:#8a8fc0}
  .badge { display:inline-block; font-size:10px; color:#ff9ecb; border:1px solid #ff9ecb;
    border-radius:6px; padding:0 4px; margin-left:6px; vertical-align:middle; }
  .bars { margin-top:8px; display:grid; grid-template-columns:1fr 1fr; gap:6px 12px;
    font-size:11px; color:#b8bce0; }
  .bar { background:#1a1c28; border-radius:6px; height:8px; overflow:hidden; margin-top:3px; }
  .bar > i { display:block; height:100%; transition:width .4s ease; }
  .bar-e>i{background:#7ee0a8} .bar-p>i{background:#6bb8ff}
  .meta { display:flex; gap:14px; font-size:11px; color:#9aa0c0; margin-top:8px; flex-wrap:wrap; }
  .typing { font-size:11px; color:#8a8fc0; margin-top:6px; min-height:14px; }
  .chat { flex:1; overflow-y:auto; padding:6px 4px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:82%; padding:9px 12px; border-radius:14px; font-size:13.5px;
    line-height:1.55; white-space:pre-wrap; }
  .msg.ai{background:#33374f;align-self:flex-start;border-bottom-left-radius:4px}
  .msg.user{background:#3a6df0;align-self:flex-end;border-bottom-right-radius:4px}
  .msg.sys{align-self:center;background:transparent;color:#7e84a8;font-size:11px;text-align:center}
  .ts { display:block; font-size:10px; color:#8a8fc0; margin-bottom:3px; }
  .urgent { display:flex; align-items:center; gap:6px; font-size:11px; color:#ff8e8e;
    margin-top:6px; }
  .inputbar { display:flex; gap:6px; margin-top:8px; }
  .inputbar input { flex:1; background:#1a1c28; border:none; border-radius:12px;
    padding:10px 12px; color:#e8e8ef; font-size:13px; }
  .inputbar button { background:#3a6df0; border:none; border-radius:12px; color:#fff;
    padding:0 14px; font-size:13px; cursor:pointer; }
  .side { width:330px; }
  .card { background:#232634; border-radius:16px; padding:16px; margin-bottom:14px; }
  .card h3 { font-size:14px; margin-bottom:10px; color:#fff; }
  .persona-name{font-size:18px;font-weight:700}
  .persona-desc{font-size:12.5px;color:#b8bce0;margin:6px 0;line-height:1.5}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{background:#33374f;border-radius:20px;padding:3px 10px;font-size:11px;color:#9aa0ff}
  .row{display:flex;justify-content:space-between;font-size:12px;color:#b8bce0;margin:5px 0}
  .legend{font-size:11.5px;color:#8a8fc0;line-height:1.65}
  .legend b{color:#c0c4e8}
  .legend code{background:#1a1c28;border-radius:4px;padding:1px 5px;color:#c0a8ff}
</style>
</head>
<body>
  <div class="phone">
    <div class="hud">
      <div class="hud-top">
        <span><span class="phase" id="phase">…</span><span class="badge">AI 朋友</span></span>
        <span class="clock" id="clock">--:--</span>
      </div>
      <div class="bars">
        <div>精力 <div class="bar bar-e"><i id="barE" style="width:0%"></i></div></div>
        <div>今日进度 <div class="bar bar-p"><i id="barP" style="width:0%"></i></div></div>
      </div>
      <div class="meta">
        <span id="mQuota">配额 0/0</span>
        <span id="mEnergy">精力 0</span>
        <span id="mMoney">余额 0</span>
        <span id="mMat">素材 0 条</span>
      </div>
      <div class="typing" id="typing"></div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="urgent">
      <input id="urgent" type="checkbox">
      <label for="urgent">紧急 / 我需要陪伴（它先放下手头的事）</label>
    </div>
    <div class="inputbar">
      <input autocomplete="off" id="txt" placeholder="对它说点什么…（/work 看它今天忙到哪了）">
      <button id="send">发送</button>
    </div>
  </div>

  <div class="side">
    <div class="card">
      <h3>你的 AI 朋友</h3>
      <div class="persona-name" id="pName">…</div>
      <div class="persona-desc" id="pDesc"></div>
      <div class="tags" id="pTags"></div>
      <div style="margin-top:10px">
        <div class="row"><span>作息</span><span id="pSch"></span></div>
        <div class="row"><span>关系阶段</span><span id="pStage"></span></div>
        <div class="row"><span>连接</span><span id="pLink">—</span></div>
      </div>
    </div>
    <div class="card">
      <h3>说明</h3>
      <div class="legend">
        <b>这不是模拟</b>：状态、工作进度、记忆、日记都来自你本机跑着的 friend-ai
        （<code>friend-&lt;id&gt;.db</code>），跟 CLI 是同一份数据。<br>
        <b>HUD</b>：它此刻在忙什么。看得到它的日子，才知道什么时候找它会打扰它。<br>
        <b>紧急</b>：勾上就开紧急窗口（也可直接说"有急事"，它自己认），
        窗口内它随叫随到，10 分钟后自动恢复。<br>
        <b>命令</b>：输入框里可直接用 <code>/work</code> <code>/memories</code>
        <code>/diary</code> <code>/status</code> 等斜杠命令，输出会显示在聊天里。
      </div>
    </div>
  </div>

<script>
let lastId = 0;
const $ = id => document.getElementById(id);
const chat = () => $('chat');

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function addMsg(m){
  const d = document.createElement('div');
  d.className = 'msg ' + (m.role === 'user' ? 'user' : 'ai');
  const t = m.ts ? m.ts.slice(11,16) : '';
  d.innerHTML = (t ? '<span class="ts">'+t+'</span>' : '') + esc(m.content);
  chat().appendChild(d);
  chat().scrollTop = chat().scrollHeight;
}
function addSys(t){
  const d = document.createElement('div');
  d.className = 'msg sys'; d.textContent = t;
  chat().appendChild(d); chat().scrollTop = chat().scrollHeight;
}

const PHASE_TEXT = {idle:'还没开工', working:'忙自己的事', flow:'刚进入状态',
                    break:'歇会儿', off:'今天忙完了', sleep:'睡着'};

function renderState(s){
  const p = s.work || {};
  const ph = document.getElementById('phase');
  ph.textContent = PHASE_TEXT[p.phase] || '—';
  ph.className = 'phase ' + (p.phase || '');
  $('clock').textContent = s.clock || '--:--';
  $('barE').style.width = (p.energy || 0) + '%';
  $('barP').style.width = (p.quota ? (p.done / p.quota * 100) : 0) + '%';
  $('mQuota').textContent = '配额 ' + (p.done||0) + '/' + (p.quota||0);
  $('mEnergy').textContent = '精力 ' + (p.energy||0);
  $('mMoney').textContent = '余额 ' + (p.money||0);
  $('mMat').textContent = '素材 ' + (p.materials||0) + ' 条';
  $('typing').textContent = s.typing ? (s.name + '正在输入…') : '';
  $('pName').textContent = s.name || '—';
  if (s.persona) {
    $('pDesc').textContent = s.persona.desc || '';
    const tg = $('pTags'); tg.innerHTML = '';
    (s.persona.tags || []).forEach(i => {
      const sp = document.createElement('span');
      sp.className = 'tag'; sp.textContent = i; tg.appendChild(sp);
    });
  }
  $('pSch').textContent = s.schedule || '';
  $('pStage').textContent = s.stage || '';
  $('pLink').textContent = s.urgent ? '紧急窗口中' : (s.state || '—');
}

async function poll(){
  try{
    const s = await (await fetch('/api/state')).json();
    renderState(s);
    const m = await (await fetch('/api/messages?after=' + lastId)).json();
    (m.messages || []).forEach(x => { addMsg(x); lastId = Math.max(lastId, x.id); });
    if (m.last_id) lastId = Math.max(lastId, m.last_id);
  }catch(e){ $('pLink').textContent = '连接断了，重连中…'; }
}

async function send(){
  const t = $('txt').value.trim();
  if (!t) return;
  $('txt').value = '';
  try{
    const r = await (await fetch('/api/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text: t, urgent: $('urgent').checked})
    })).json();
    $('urgent').checked = false;
    if (r.echo !== false) addMsg({role:'user', content:t, ts:r.ts});
    if (r.reply) addSys(r.reply);          // 斜杠命令的输出
    poll();
  }catch(e){ addSys('⚠ 发送失败：' + e.message); }
}

$('send').onclick = send;
$('txt').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
poll();
setInterval(poll, 900);
</script>
</body>
</html>
