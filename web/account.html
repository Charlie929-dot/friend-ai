<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>账号管理 · 有生活的朋友</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    /* 晨雾治愈风（与聊天主界面 / 登录页同一套视觉） */
    --bg: #f3f1ea; --surface: #fbfaf6; --surface-2: #efede4; --line: #e4e1d5;
    --ink: #40473f; --muted: #98a096; --accent: #83a585; --accent-soft: #e3ebe1;
    --danger: #d98a8a; --danger-soft: #f6e4e4;
    --shadow: 0 16px 48px rgba(90,104,80,.12);
  }
  body { min-height:100vh; padding:40px 16px 48px; background:var(--bg); color:var(--ink);
         background-image: radial-gradient(70% 45% at 50% 0%, var(--accent-soft) 0%, var(--bg) 68%);
         font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:430px; margin:0 auto; }
  .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .top h1 { margin:0; font-size:20px; font-weight:700; }
  a.back { color:var(--muted); text-decoration:none; font-size:13px; padding:6px 12px;
           border-radius:99px; background:var(--surface); border:1px solid var(--line); transition:color .15s; }
  a.back:hover { color:var(--accent); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:18px;
          padding:22px 20px; margin-bottom:16px; box-shadow:var(--shadow); }
  .card h2 { margin:0 0 4px; font-size:16px; font-weight:600; }
  .card .desc { margin:0 0 16px; font-size:13px; color:var(--muted); }
  label { display:block; margin:12px 0 6px; font-size:13px; color:var(--muted); }
  input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:12px;
          background:var(--surface); color:var(--ink); font-size:15px; outline:none; transition:border-color .15s, box-shadow .15s; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  input[type=text].code { letter-spacing:.35em; font-size:19px; text-align:center; }
  button { padding:10px 18px; border:0; border-radius:11px; cursor:pointer;
           background:var(--accent); color:#fff; font-size:14px; font-weight:600;
           transition:filter .15s, transform .05s; }
  button:hover { filter:brightness(1.06); }
  button:active { transform:translateY(1px); }
  button.ghost { background:var(--surface-2); color:var(--muted); }
  button.ghost:hover { color:var(--ink); filter:none; }
  button.danger { background:var(--danger-soft); color:var(--danger); }
  button.danger:hover { filter:none; background:color-mix(in srgb, var(--danger-soft) 70%, var(--danger) 10%); }
  button:disabled { opacity:.45; cursor:not-allowed; filter:none; transform:none; }
  .msg { margin:12px 0 0; padding:9px 12px; border-radius:10px; font-size:13px; display:none; }
  .msg.err { background:var(--danger-soft); color:var(--danger); }
  .msg.ok { background:var(--accent-soft); color:var(--accent); }
  .msg:empty { display:none; }
  .status { display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:600; }
  .status.on { background:var(--accent-soft); color:var(--accent); }
  .status.off { background:var(--surface-2); color:var(--muted); }
  .row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  #qrBox { margin:16px 0 0; text-align:center; }
  #qrBox svg, #qrBox img { background:#fff; padding:10px; border-radius:12px; border:1px solid var(--line); }
  .secret { margin:12px 0 4px; text-align:center; font-family:Consolas,monospace;
            font-size:14px; letter-spacing:.12em; color:var(--ink);
            word-break:break-all; user-select:all; }
  .hint { margin:4px 0 0; text-align:center; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>账号管理</h1>
    <a class="back" href="/">← 回聊天</a>
  </div>

  <!-- 修改密码 -->
  <div class="card">
    <h2>修改密码</h2>
    <p class="desc">改完后所有已登录的设备都要重新登录。</p>
    <form id="pwForm">
      <label>当前密码</label>
      <input type="password" id="pwOld" autocomplete="current-password" required>
      <label id="pwTotpLabel" style="display:none">当前动态口令</label>
      <input type="text" id="pwTotp" class="code" maxlength="6" inputmode="numeric"
             style="display:none" placeholder="6 位" autocomplete="one-time-code">
      <label>新密码（至少 8 位）</label>
      <input type="password" id="pwNew" autocomplete="new-password" required minlength="8">
      <label>确认新密码</label>
      <input type="password" id="pwNew2" autocomplete="new-password" required minlength="8">
      <div class="row"><button type="submit" id="pwBtn">改密码</button></div>
      <div class="msg" id="pwMsg"></div>
    </form>
  </div>

  <!-- 动态口令 TOTP -->
  <div class="card">
    <h2>动态口令 <span class="status off" id="totpStatus">未开启</span></h2>
    <p class="desc">手机验证器 App（Google Authenticator / 微软验证器等）的 6 位动态码，
       和密码组成双保险。换手机或怀疑泄露时重绑一个新密钥。</p>

    <!-- 未开启 / 重绑入口 -->
    <form id="setupForm">
      <label>当前密码</label>
      <input type="password" id="setupPw" autocomplete="current-password" required>
      <label id="setupTotpLabel" style="display:none">当前动态口令</label>
      <input type="text" id="setupTotp" class="code" maxlength="6" inputmode="numeric"
             style="display:none" placeholder="6 位" autocomplete="one-time-code">
      <div class="row">
        <button type="submit" id="setupBtn">生成新密钥</button>
        <button type="button" class="danger" id="disableBtn" style="display:none">关闭动态口令</button>
      </div>
      <div class="msg" id="setupMsg"></div>
    </form>

    <!-- 扫码确认（生成密钥后显示） -->
    <div id="confirmBox" style="display:none">
      <div id="qrBox"></div>
      <div class="secret" id="newSecret"></div>
      <p class="hint">扫不了码就选「手动输入密钥」，抄上面这串（类型：基于时间）</p>
      <form id="confirmForm">
        <label>输入验证器上显示的 6 位数字</label>
        <input type="text" id="confirmCode" class="code" maxlength="6" inputmode="numeric"
               placeholder="6 位" autocomplete="one-time-code" required>
        <div class="row">
          <button type="submit" id="confirmBtn">确认绑定</button>
          <button type="button" class="ghost" id="cancelBtn">取消</button>
        </div>
        <div class="msg" id="confirmMsg"></div>
      </form>
    </div>
  </div>
</div>

<script src="/qr.js"></script>
<script>
function $(id){ return document.getElementById(id); }
function show(el, text, ok){
  el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.style.display = text ? 'block' : 'none';
}
async function api(path, body){
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
                               body: JSON.stringify(body || {})});
  const j = await r.json().catch(() => ({error:'响应不是 JSON'}));
  if (r.status === 401 && j.error === '未登录') { location.href = '/login'; throw new Error('未登录'); }
  return j;
}

var totpOn = false, pendingSecret = '';

async function loadStatus(){
  try{
    const s = await (await fetch('/api/account/status')).json();
    totpOn = !!s.totp_enabled;
  }catch(e){ totpOn = false; }
  var st = $('totpStatus');
  st.textContent = totpOn ? '已开启' : '未开启';
  st.className = 'status ' + (totpOn ? 'on' : 'off');
  $('pwTotpLabel').style.display = totpOn ? 'block' : 'none';
  $('pwTotp').style.display = totpOn ? 'block' : 'none';
  $('setupTotpLabel').style.display = totpOn ? 'block' : 'none';
  $('setupTotp').style.display = totpOn ? 'block' : 'none';
  $('setupBtn').textContent = totpOn ? '重绑新密钥' : '开启动态口令';
  $('disableBtn').style.display = totpOn ? '' : 'none';
}

// --- 修改密码 ---
$('pwForm').addEventListener('submit', async function(ev){
  ev.preventDefault();
  if ($('pwNew').value !== $('pwNew2').value){
    show($('pwMsg'), '两次输入的新密码不一样', false); return;
  }
  $('pwBtn').disabled = true;
  try{
    const j = await api('/api/account/password', {
      password: $('pwOld').value, new: $('pwNew').value, totp: $('pwTotp').value
    });
    if (j.error){ show($('pwMsg'), j.error, false); }
    else{
      show($('pwMsg'), '改好了，跳去重新登录…', true);
      setTimeout(function(){ location.href = '/login'; }, 900);
    }
  }catch(e){ show($('pwMsg'), '请求失败：' + e.message, false); }
  $('pwBtn').disabled = false;
});

// --- 生成新 TOTP 密钥 ---
$('setupForm').addEventListener('submit', async function(ev){
  ev.preventDefault();
  $('setupBtn').disabled = true;
  try{
    const j = await api('/api/account/totp/setup', {
      password: $('setupPw').value, totp: $('setupTotp').value
    });
    if (j.error){ show($('setupMsg'), j.error, false); }
    else{
      pendingSecret = j.secret;
      show($('setupMsg'), '', true);
      $('confirmBox').style.display = 'block';
      $('newSecret').textContent = j.secret;
      try{
        var qr = qrcode(0, 'M'); qr.addData(j.uri); qr.make();
        $('qrBox').innerHTML = qr.createSvgTag(4, 8);
      }catch(e){ $('qrBox').innerHTML = '<p class="hint">二维码生成失败，用手动输入密钥</p>'; }
      $('confirmCode').focus();
    }
  }catch(e){ show($('setupMsg'), '请求失败：' + e.message, false); }
  $('setupBtn').disabled = false;
});

// --- 确认绑定 ---
$('confirmForm').addEventListener('submit', async function(ev){
  ev.preventDefault();
  $('confirmBtn').disabled = true;
  try{
    const j = await api('/api/account/totp/confirm', {
      password: $('setupPw').value, totp: $('setupTotp').value,
      secret: pendingSecret, code: $('confirmCode').value
    });
    if (j.error){ show($('confirmMsg'), j.error, false); }
    else{
      show($('confirmMsg'), '绑定成功，以后登录要输动态口令了', true);
      setTimeout(function(){ location.reload(); }, 1100);
    }
  }catch(e){ show($('confirmMsg'), '请求失败：' + e.message, false); }
  $('confirmBtn').disabled = false;
});

$('cancelBtn').addEventListener('click', function(){
  pendingSecret = '';
  $('confirmBox').style.display = 'none';
});

// --- 关闭 TOTP ---
$('disableBtn').addEventListener('click', async function(){
  $('disableBtn').disabled = true;
  try{
    const j = await api('/api/account/totp/disable', {
      password: $('setupPw').value, totp: $('setupTotp').value
    });
    if (j.error){ show($('setupMsg'), j.error, false); }
    else{ show($('setupMsg'), '已关闭动态口令，只凭密码登录', true); loadStatus(); }
  }catch(e){ show($('setupMsg'), '请求失败：' + e.message, false); }
  $('disableBtn').disabled = false;
});

loadStatus();
</script>
</body>
</html>
